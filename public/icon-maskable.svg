<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Centered safe-zone iconography (within 80% circle) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Code Bracket Left -->
    <path d="M 180 160 L 100 256 L 180 352" fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Code Bracket Right -->
    <path d="M 332 160 L 412 256 L 332 352" fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Play / Execute Bolt -->
    <polygon points="230,175 310,256 230,337" fill="url(#accentGrad)" />

    <!-- Modern status dot -->
    <circle cx="256" cy="400" r="16" fill="#10b981" />
  </g>
</svg>
